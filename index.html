<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5분브리핑 — 공유된 브리핑 항목</title>

  <!-- OG 태그: 크롤러(카카오톡 등)가 JS 미실행 상태로 읽는 정적 값 -->
  <meta property="og:type"        content="website">
  <meta property="og:site_name"   content="5분브리핑">
  <meta property="og:title"       content="5분브리핑 — 공유된 브리핑 항목">
  <meta property="og:description" content="5분브리핑에서 공유 — 자세히보기 ↓">
  <meta property="og:image"       content="https://foresightcompanylab.github.io/news-briefing-share/og.png">
  <meta property="og:image:width" content="500">
  <meta property="og:image:height" content="500">
  <meta property="og:url"         content="https://foresightcompanylab.github.io/news-briefing-share/">

  <!-- 트위터 카드 (일부 앱이 twitter: 태그 우선 참조) -->
  <meta name="twitter:card"        content="summary_large_image">
  <meta name="twitter:title"       content="5분브리핑 — 공유된 브리핑 항목">
  <meta name="twitter:description" content="5분브리핑에서 공유 — 자세히보기 ↓">
  <meta name="twitter:image"       content="https://foresightcompanylab.github.io/news-briefing-share/og.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #051131;
      color: #E8EEFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 20px 48px;
    }
    .header {
      width: 100%;
      max-width: 480px;
      margin-bottom: 28px;
    }
    .app-name {
      font-size: 18px;
      font-weight: 700;
      color: #EFA830;
      letter-spacing: -0.3px;
    }
    .app-sub {
      font-size: 12px;
      color: #4A5578;
      margin-top: 3px;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #0C1C45;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 14px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
    }
    .badge-stock   { background: rgba(232,112,96,.15); color: #E87060; }
    .badge-economy { background: rgba(61,196,154,.15);  color: #3DC49A; }
    .badge-society { background: rgba(155,148,232,.15); color: #9B94E8; }
    .badge-default { background: rgba(136,146,176,.15); color: #8892B0; }
    .item-text {
      font-size: 15px;
      line-height: 1.75;
      color: #E8EEFF;
      word-break: keep-all;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 18px 0;
    }
    .sources-label {
      font-size: 12px;
      color: #8892B0;
      margin-bottom: 10px;
    }
    .source-link {
      display: flex;
      background: #132560;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #E8EEFF;
      font-size: 13px;
      line-height: 1.45;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }
    .source-link:last-child { margin-bottom: 0; }
    .source-link:hover { opacity: 0.8; }
    .source-title { flex: 1; }
    .source-icon { font-size: 11px; opacity: 0.5; flex-shrink: 0; margin-top: 2px; }
    .market-context-box {
      border-radius: 10px;
      padding: 14px;
      margin-top: 18px;
      border-width: 1px;
      border-style: solid;
    }
    .market-context-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      gap: 6px;
    }
    .market-context-title {
      font-size: 12px;
      font-weight: 600;
      color: #8892B0;
      flex: 1;
    }
    .strength-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
    }
    .market-context-text {
      font-size: 13px;
      line-height: 1.65;
      color: #8892B0;
    }
    .btn-wrap {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      border: none;
      cursor: pointer;
    }
    .btn-primary  { background: #EFA830; color: #051131; }
    .btn-secondary {
      background: #0C1C45;
      color: #E8EEFF;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #4A5578;
      text-align: center;
      line-height: 1.6;
    }
    #loading-view {
      text-align: center;
      padding: 60px 20px;
      color: #8892B0;
      font-size: 15px;
    }
    #error-view {
      display: none;
      text-align: center;
      padding: 60px 20px;
      width: 100%;
      max-width: 480px;
    }
    #error-view p { color: #8892B0; font-size: 15px; margin-bottom: 24px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="app-name">5분브리핑</div>
    <div class="app-sub">5분브리핑에서 공유 — 자세히보기 ↓</div>
  </div>

  <div id="loading-view">불러오는 중...</div>

  <div id="main-view" style="width:100%;max-width:480px;display:none">
    <div class="card">
      <span class="badge badge-default" id="badge">브리핑</span>
      <div class="item-text" id="item-text"></div>
      <div id="market-context-section" style="display:none">
        <div class="market-context-box" id="market-context-box">
          <div class="market-context-header">
            <span>📈</span>
            <span class="market-context-title">증시 맥락</span>
            <span class="strength-badge" id="strength-badge"></span>
          </div>
          <div class="market-context-text" id="market-context-text"></div>
        </div>
      </div>
      <div id="sources-section" style="display:none">
        <div class="divider"></div>
        <div class="sources-label" id="sources-label">관련 기사</div>
        <div id="sources-list"></div>
      </div>
    </div>

    <div class="btn-wrap">
      <a class="btn btn-primary" id="btn-app" href="#">앱에서 보기</a>
      <a class="btn btn-secondary"
         href="https://play.google.com/store/apps/details?id=com.foresight.news_briefing"
         target="_blank" rel="noopener">
        앱 다운로드 (Android)
      </a>
    </div>
  </div>

  <div id="error-view">
    <p>링크가 올바르지 않거나 만료되었어요.</p>
    <a class="btn btn-primary"
       href="https://play.google.com/store/apps/details?id=com.foresight.news_briefing"
       target="_blank" rel="noopener">
      5분브리핑 다운로드
    </a>
  </div>

  <div class="footer">
    5분브리핑 &middot; 매일 아침 6시 뉴스 브리핑
  </div>

  <script>
    (function () {
      var SUPABASE_URL = 'https://dovgizumldgfuyguqycq.supabase.co';
      var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRvdmdpenVtbGRnZnV5Z3VxeWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1MTUxNjgsImV4cCI6MjA5NDA5MTE2OH0.dw5eKMWCtTlf_WW8bFhs6zSrFi2vbPn0li2IBav5yNg';

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var d  = params.get('d');   // 구버전 호환

      if (id) {
        fetchFromSupabase(id);
      } else if (d) {
        renderFromBase64(d);
      } else {
        showError();
      }

      // ── 신버전: Supabase에서 데이터 fetch ──────────────────────────
      function fetchFromSupabase(shareId) {
        fetch(
          SUPABASE_URL + '/rest/v1/share_cache?id=eq.' + encodeURIComponent(shareId) + '&select=section,item_text,sources,market_context,insight_strength',
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
          }
        )
        .then(function(res) { return res.json(); })
        .then(function(rows) {
          if (!rows || rows.length === 0) { showError(); return; }
          var row = rows[0];
          renderContent({
            sec: row.section,
            t: row.item_text,
            src: (row.sources || []).map(function(s) {
              return { t: s.title, u: s.link };
            }),
            market_context: row.market_context || null,
            insight_strength: row.insight_strength || null,
          });
          setAppOpenButton('?id=' + shareId);
        })
        .catch(function() { showError(); });
      }

      // ── 구버전: base64 인코딩 URL 처리 ────────────────────────────
      function renderFromBase64(encoded) {
        var raw = b64decode(encoded);
        if (!raw) { showError(); return; }
        var data;
        try { data = JSON.parse(raw); } catch(e) { showError(); return; }
        renderContent(data);
        setAppOpenButton('?d=' + encoded);
      }

      // ── 공통 렌더링 ────────────────────────────────────────────────
      function renderContent(data) {
        var secMap = {
          stock:   ['증시',  'stock'],
          economy: ['경제',  'economy'],
          society: ['사회',  'society']
        };
        var sec = secMap[data.sec] || ['브리핑', 'default'];
        var badge = document.getElementById('badge');
        badge.textContent = sec[0];
        badge.className = 'badge badge-' + sec[1];

        document.getElementById('item-text').textContent = data.t || '';

        // 증시 맥락
        if (data.market_context) {
          var strengthMap = {
            strong:   { label: '시장 영향 높음', color: '#EFA830' },
            moderate: { label: '시장 영향 중간', color: '#3DC49A' },
            weak:     { label: '시장 영향 낮음', color: '#8892B0' },
          };
          var st = strengthMap[data.insight_strength] || strengthMap['weak'];
          var box = document.getElementById('market-context-box');
          box.style.background = 'rgba(255,255,255,0.04)';
          box.style.borderColor = st.color + '40';
          var badge = document.getElementById('strength-badge');
          badge.textContent = st.label;
          badge.style.background = st.color + '20';
          badge.style.color = st.color;
          document.getElementById('market-context-text').textContent = data.market_context;
          document.getElementById('market-context-section').style.display = 'block';
        }

        // 관련 기사
        if (data.src && data.src.length > 0) {
          document.getElementById('sources-section').style.display = 'block';
          document.getElementById('sources-label').textContent =
            '관련 기사 ' + data.src.length + '건';
          var list = document.getElementById('sources-list');
          data.src.forEach(function(s) {
            var a = document.createElement('a');
            a.className = 'source-link';
            a.href = s.u || '#';
            a.target = '_blank';
            a.rel = 'noopener';
            a.innerHTML =
              '<span class="source-title">' + escapeHtml(s.t || s.u || '') + '</span>' +
              '<span class="source-icon">↗</span>';
            list.appendChild(a);
          });
        }

        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
      }

      // ── 앱 열기 버튼 설정 ──────────────────────────────────────────
      function setAppOpenButton(queryString) {
        var ua = navigator.userAgent || '';
        var fullUrl = 'https://foresightcompanylab.github.io/news-briefing-share/' + queryString;
        if (/android/i.test(ua)) {
          document.getElementById('btn-app').href =
            'intent://foresightcompanylab.github.io/news-briefing-share/' +
            queryString +
            '#Intent;scheme=https;package=com.foresight.news_briefing;' +
            'S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.foresight.news_briefing;end';
        } else {
          document.getElementById('btn-app').href = fullUrl;
        }
      }

      function showError() {
        document.getElementById('loading-view').style.display = 'none';
        document.getElementById('error-view').style.display = 'block';
      }

      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function b64decode(str) {
        str = str.replace(/-/g, '+').replace(/_/g, '/');
        while (str.length % 4) str += '=';
        try {
          return decodeURIComponent(
            Array.prototype.map.call(atob(str), function(c) {
              return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join('')
          );
        } catch (e) { return null; }
      }
    })();
  </script>
</body>
</html>
